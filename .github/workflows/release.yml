name: Stable GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    name: Verify tagged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate tag/version and release notes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os, pathlib, tomllib
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          assert pathlib.Path(f'.github/release-notes/v{version}.md').is_file()
          PY
      - name: Regression tests and build
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m pip wheel . --no-deps -w dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-wheel
          path: dist
      - name: Publish GitHub release without overwriting existing tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; not overwriting.'
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PG Security Drift $GITHUB_REF_NAME — PostgreSQL RLS & Privilege Drift Guard" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
            --latest
