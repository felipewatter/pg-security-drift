name: Artifact upload/download compatibility
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/artifact-roundtrip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Produce exact fixture bytes
        shell: bash
        run: |
          printf 'artifact-roundtrip-v1\n' > payload.txt
          printf 'artifact-roundtrip-v1\n' | cmp - payload.txt
      - name: Upload pinned artifact action
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roundtrip-fixture
          path: payload.txt
          if-no-files-found: error
          retention-days: 1
  download:
    runs-on: ubuntu-latest
    needs: upload
    steps:
      - name: Download pinned artifact action
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: roundtrip-fixture
          path: payload
      - name: Fail closed on missing or modified content
        shell: bash
        run: |
          test -f payload/payload.txt
          printf 'artifact-roundtrip-v1\n' | cmp - payload/payload.txt
          test "$(find payload -type f | wc -l | tr -d ' ')" = 1
